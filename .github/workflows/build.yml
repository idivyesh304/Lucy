name: Build Lucy APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: |
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          npm ci

      - name: Create Android project
        run: |
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android

      - name: Use Lucy's permanent signing key
        run: |
          mkdir -p ~/.android
          cp resources/android/lucy-debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Lucy-1.0.${{ github.run_number }}.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lucy-${{ github.run_number }}
          name: Lucy 1.0.${{ github.run_number }}
          body: Download the .apk file below on your Android phone and install it.
          files: Lucy-1.0.${{ github.run_number }}.apk
          make_latest: true
