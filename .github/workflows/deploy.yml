name: Deploy Lucy (iPhone web app + helper)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lucy-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Deploy helper to Cloudflare
        id: helper
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not added yet, skipping helper."
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd helper
          npm i -g wrangler@4.151.3 > /dev/null
          ID=$(wrangler kv namespace list 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const a=JSON.parse(s.slice(s.indexOf('[')));const n=a.find(x=>/lucy-data/.test(x.title));console.log(n?n.id:'')}catch(e){console.log('')}})")
          if [ -z "$ID" ]; then
            wrangler kv namespace create lucy-data 2>&1 | tee kv.log
            ID=$(grep -oE '[0-9a-f]{32}' kv.log | head -1)
          fi
          echo "KV namespace: $ID"
          sed "s/__KV_ID__/$ID/" wrangler.base.toml > wrangler.toml
          wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://lucy-helper\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1)
          echo "Helper URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build iPhone web app
        env:
          HELPER_URL: ${{ steps.helper.outputs.url || 'https://lucy-helper.idivyesh007.workers.dev' }}
        run: |
          npm run build:web
          echo "window.LUCY_CONFIG = { helperUrl: '${HELPER_URL}', build: '${{ github.run_number }}' };" > web/config.js
          sed -i "s/__BUILD__/${{ github.run_number }}/g" web/sw.js
          touch web/.nojekyll

      - name: Publish helper address
        if: steps.helper.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete helper --yes --cleanup-tag -R ${{ github.repository }} || true
          gh release create helper -R ${{ github.repository }} --prerelease --title "Lucy helper address" --notes "${{ steps.helper.outputs.url }}"

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before last retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90
      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Report errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Deploy failed in run ${{ github.run_number }}"; tail -60 helper/deploy.log 2>/dev/null; tail -40 helper/kv.log 2>/dev/null; } > errors.txt || true
          gh release delete deploy-errors --yes --cleanup-tag -R ${{ github.repository }} || true
          gh release create deploy-errors -R ${{ github.repository }} --prerelease --title "Deploy errors (run ${{ github.run_number }})" --notes-file errors.txt
